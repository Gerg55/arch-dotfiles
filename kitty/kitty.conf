remember_window_size no
remember_window_position no
initial_window_width 800
initial_window_height 600

font_family Adwaita Mono

background #14181B

active_border_color #FFFFFF
inactive_border_color #999999
window_border_width 0.5pt
window_margin_width 1.5
draw_window_borders_for_single_window yes
window_padding_width 0.5

enabled_layouts Tall, *

tab_bar_style powerline
tab_powerline_style slanted

active_tab_foreground #FFFFFF
active_tab_background #366c7c
inactive_tab_foreground #FFFFFF
inactive_tab_background #216d82

selection_background #65c9e4
selection_foreground #000000

tab_bar_min_tabs 1

dynamic_background_opacity yes
background_opacity 0.7
background_tint 1
enable_background_blur yes
background_blur 1

enable_audio_bell no
